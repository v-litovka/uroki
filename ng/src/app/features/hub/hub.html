<app-page-hero title="Игры" size="xl">
  <app-tabs label="Класс" [items]="tabs()" />
</app-page-hero>
<p class="lead">Выбери игру. Звёзды и уровни у каждой игры свои.</p>

<div class="grid">
  @for (x of entries(); track x.id) {
    @if (x.kind === 'legacy') {
      <a app-game-tile [href]="'legacy/' + x.path" [tag]="subjects[x.subject].title" [title]="x.title" [desc]="x.desc" [color]="x.color"></a>
    } @else {
      <a app-game-tile [routerLink]="['/', x.grade, x.subject, x.id]" [tag]="subjects[x.subject].title" [title]="x.title" [desc]="x.desc" [color]="x.color"></a>
    }
  }
</div>

@if (extras().length) {
  <div class="extras">
    @for (e of extras(); track e.path) {
      <a app-btn [href]="'legacy/' + e.path">{{ e.title }}</a>
    }
  </div>
}
