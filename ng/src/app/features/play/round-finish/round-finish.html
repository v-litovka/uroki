<app-card [center]="true">
  <app-pet-group [pets]="pets()" size="lg" />
  <h2>Готово!</h2>
  @if (total() > 1) {
    <p class="stat">С первого раза: {{ ok() }} из {{ total() }} · +{{ stars() }} ⭐</p>
  } @else {
    <p class="stat">+{{ stars() }} ⭐</p>
  }
  @if (levelUp()) {
    <app-level-up [level]="level()" />
  }
  <div class="acts">
    @if (nextMode(); as nx) {
      <a app-btn [routerLink]="['..', nx.id]">{{ nx.icon }} {{ nx.title }} →</a>
    }
    <button app-btn variant="ghost" (click)="again.emit()">Ещё раз</button>
    <a app-btn variant="ghost" routerLink="..">К теме</a>
  </div>
</app-card>
