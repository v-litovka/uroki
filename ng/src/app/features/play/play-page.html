@if (fin(); as f) {
  <app-round-finish
    [ok]="f.ok"
    [total]="f.n"
    [levelUp]="f.levelUp"
    [level]="level()"
    [mascot]="mascot()"
    [nextMode]="nextMode()"
    (again)="restart()"
  />
} @else if (current(); as ex) {
  <app-round-header [kicker]="kicker()" [pos]="pos()" [len]="len()" [again]="again()" />
  <app-exercise-player [exercise]="ex" [mascot]="mascot()" [phrases]="p.pack()?.phrases" (finished)="onDone($event)" />
}
