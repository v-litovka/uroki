<form class="row" (submit)="check($event)">
  <input
    #inp
    class="inp"
    [class.right]="done()"
    [class.bad]="shake()"
    [disabled]="done()"
    [placeholder]="placeholder()"
    [attr.inputmode]="numeric() ? 'numeric' : null"
    [attr.pattern]="numeric() ? '[0-9]*' : null"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
    aria-label="ответ"
  />
  <button app-btn [disabled]="done()">Проверить</button>
</form>
