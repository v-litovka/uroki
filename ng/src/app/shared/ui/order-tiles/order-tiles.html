@if (inline()) {
  <div class="built row" aria-live="polite">
    @for (t of items(); track $index) {
      <span class="cell" [class.on]="$index < pos()">{{ $index < pos() ? t : '' }}</span>
    }
  </div>
} @else {
  <div class="built" aria-live="polite">
    @for (t of built(); track $index) {
      <span class="ln">{{ t }}</span>
    }
  </div>
}
<div class="tiles" [class.row]="inline()">
  @for (o of order(); track o.k) {
    <button type="button" class="tile" [class.used]="used().has(o.k)" [class.bad]="shake() === o.k" [disabled]="used().has(o.k)" (click)="tap(o)">
      {{ o.t }}
    </button>
  }
</div>
