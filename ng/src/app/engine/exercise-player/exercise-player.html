<app-card>
  <app-prompt-view [prompt]="scene()" />

  @if (step(); as st) {
    @switch (st.kind) {
      @case ('choice') {
        <app-option-grid
          [options]="st.options"
          [answer]="st.answer"
          [layout]="st.layout ?? 'grid'"
          [doShuffle]="st.shuffle !== false"
          [lockSec]="st.lockSec ?? 0"
          (picked)="onPick($event)"
        />
      }
      @case ('input') {
        <app-answer-input [answer]="st.answer" [placeholder]="st.placeholder ?? ''" [numeric]="!!st.numeric" (typed)="onType($event)" />
      }
      @case ('why') {
        @if (praise(); as pr) {
          <app-feedback [ok]="true" [text]="pr.text" [pet]="pr.pet" />
        }
        <app-why-step-view [ok]="st.ok" [wrong]="st.wrong" (answered)="onWhy($event)" />
      }
      @case ('memorize') {
        <app-confirm-button [label]="st.button" [lockSec]="st.lockSec ?? 0" (confirmed)="memorized()" />
      }
      @case ('order') {
        @if (st.note) {
          <app-hint>{{ st.note }}</app-hint>
        }
        <app-order-tiles [items]="st.items" (wrong)="onOrderWrong(st, $event.pos)" (done)="onOrderDone()" />
      }
    }
  }

  @if (fb(); as f) {
    <app-feedback [ok]="f.ok" [text]="f.text" [pet]="f.pet" />
  }
  @if (diff(); as d) {
    <app-letter-diff [letters]="d" />
  }
</app-card>
